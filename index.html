<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangul keys</title>
    <link rel="stylesheet" href="tutor.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
      </div>
      <p class="score" id="score"></p>
    </header>
    <p class="help" id="help"></p>
    <p class="struggle" id="struggle" hidden></p>
    <div id="stage" aria-live="polite"></div>
    <div class="callout" id="callout"></div>
    <div class="board" id="board"></div>
    <footer>
      <button type="button" id="keyboard" aria-pressed="false">Hide keyboard (`)</button>
      <button type="button" id="repeat">Repeat this line</button>
      <label class="place" for="place">Up to <select id="place"></select></label>
      <button type="button" id="save" title="Write status.json next to the tutor">Save status</button>
      <button type="button" id="reset">Reset</button>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
